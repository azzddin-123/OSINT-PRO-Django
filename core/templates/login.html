{% extends 'base.html' %}

{% block content %}

<div class="card" style="max-width:400px; margin:auto;">
    <h2>Connexion a SEARCHeveryting</h2>

    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label class="form-label">Nom d'utilisateur</label>
            <input type="text" name="username" class="form-input" placeholder="Entrer votre username">
        </div>

        <div class="form-group">
            <label class="form-label">Mot de passe</label>
            <input type="password" name="password" class="form-input" placeholder="••••••••">
        </div>

        <button type="submit" class="form-btn">Se connecter</button>
    </form>

    <p class="form-error">{{ error }}</p>

    <p>Pas de compte ? <a href="/register/">Créer un compte</a></p>
</div>

{% endblock %}
